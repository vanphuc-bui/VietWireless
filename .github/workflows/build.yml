name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install

      - name: Check writing style
        run: npm run check:writing

      - name: Check math style
        run: npm run check:math

      - name: Check lesson contract
        run: npm run check:lesson

      - name: Build
        run: npm run build
